:root{--product-surface:#f8f9f9;--paper:#ffffff;--ink:#172d35;--muted:#66787a;--line:#d8ded7;--pine:#254b4a;--lime:#d9e9a5;--white:#fffefa;--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}button,input{font:inherit}.shell{max-width:1440px;margin:auto;padding:0 clamp(18px,4vw,58px)}
.topbar{position:relative;border-bottom:1px solid var(--line);background:#f8f8f6}.topbar-inner{max-width:1440px;margin:auto;padding:30px clamp(18px,4vw,58px)}.panoply-wordmark{display:block;width:max-content;color:#b99a5a;text-decoration:none;font:750 13px/1.2 var(--sans);letter-spacing:.22em;text-transform:uppercase}.brand{display:block;width:max-content;margin-top:12px;text-decoration:none;color:var(--ink);line-height:1}.closet-wordmark{display:flex;align-items:baseline;gap:.16em;margin:0;font:400 clamp(38px,5.3vw,64px)/1.12 Georgia,"Times New Roman",serif;letter-spacing:-.045em;color:#1C3247;white-space:nowrap}.wordmark-the{flex:none;align-self:flex-start;margin-top:.10em;font-size:.38em;font-style:italic;line-height:1.1;letter-spacing:-.015em}.wordmark-title{display:inline-flex;align-items:baseline;gap:.2em}.header-rule{display:block;width:43px;height:2px;background:#b99a5a;margin-top:10px}.brand-mark{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pine);color:var(--lime);font:16px var(--serif);letter-spacing:0}.brand-muted,.top-note{color:var(--muted);font-weight:500;letter-spacing:.08em}
.hero{position:relative;overflow:hidden;margin:32px 0 26px;padding:clamp(30px,5vw,66px);border-radius:26px;background:var(--pine);color:#f7f4eb;min-height:290px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px}.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(217,233,165,.26);border-radius:50%;pointer-events:none}.hero:before{width:420px;height:420px;right:12%;top:-250px}.hero:after{width:290px;height:290px;right:19%;top:-180px}.hero-copy,.hero-stats{position:relative;z-index:1}.eyebrow{margin:0 0 16px;color:var(--lime);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{max-width:780px;margin:0;font:clamp(44px,7.2vw,92px)/.93 var(--serif);letter-spacing:-.055em;font-weight:400}.hero-sub{max-width:440px;margin:20px 0 0;color:#d8e2d8;font-size:15px;line-height:1.6}.hero-stats{min-width:170px;padding-left:24px;border-left:1px solid rgba(247,244,235,.3);align-self:flex-end}.stat{font:40px/1 var(--serif);color:var(--lime);letter-spacing:-.04em}.stat-label{margin-top:7px;color:#d8e2d8;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:34px 0 16px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 16px;color:var(--ink);font-size:12px;font-weight:650;cursor:pointer;transition:.18s ease}.filter:hover{border-color:var(--pine)}.filter.active{background:var(--ink);border-color:var(--ink);color:white}.search{position:relative;flex:0 0 min(320px,35vw)}.search input{width:100%;border:1px solid var(--line);border-radius:999px;background:var(--white);padding:12px 42px 12px 16px;font-size:13px;color:var(--ink);outline:none}.search input:focus{border-color:var(--pine);box-shadow:0 0 0 3px rgba(37,75,74,.1)}.search svg{position:absolute;right:15px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.results-line{display:flex;justify-content:space-between;align-items:center;margin:20px 2px;color:var(--muted);font-size:12px}.results-line strong{color:var(--ink);font-weight:650}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:var(--product-surface);transition:transform .2s ease,box-shadow .2s ease;cursor:pointer}.card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(28,50,48,.09)}.card:focus-visible,.filter:focus-visible,.close:focus-visible{outline:3px solid #8aaa65;outline-offset:3px}
.photo{position:relative;aspect-ratio:.84;background:var(--product-surface);display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;padding:3%;mix-blend-mode:multiply;transition:transform .35s ease}.card:hover .photo img{transform:scale(1.04)}.placeholder{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(ellipse at 70% 25%,#fff8 0,transparent 42%),linear-gradient(145deg,#e8eadf,#d5ded2);color:var(--pine)}.placeholder-title{font:clamp(28px,4vw,48px)/1 var(--serif);letter-spacing:-.04em}.placeholder-color{margin-top:10px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}.count{position:absolute;right:12px;top:12px;border:1px solid rgba(23,45,53,.11);border-radius:999px;padding:7px 10px;background:#fffefaeb;color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.04em}.card-info{padding:11px 12px 13px;background:#f2f4f3}.card-kicker{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.card-brand{margin:7px 0 2px;font-size:10px;color:var(--muted)}.card-name{margin:0;font:17px/1.12 var(--serif);letter-spacing:-.025em}.card-color{margin:5px 0 0;color:var(--muted);font-size:10px}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted);font:24px var(--serif)}
.footer{display:flex;justify-content:space-between;gap:16px;padding:30px 0 40px;margin-top:38px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}dialog{width:min(640px,calc(100% - 28px));max-height:90vh;padding:0;border:0;border-radius:22px;background:var(--white);color:var(--ink);box-shadow:0 28px 100px #102c2c55}dialog::backdrop{background:#102a2acc;backdrop-filter:blur(5px)}.modal-photo{height:min(47vh,430px);background:var(--product-surface);display:grid;place-items:center}.modal-photo img{max-width:100%;max-height:100%;object-fit:contain;padding:8%}.modal-info{padding:24px}.modal-info h2{margin:8px 0;font:clamp(28px,6vw,42px)/1.05 var(--serif);letter-spacing:-.04em}.modal-info p{color:var(--muted)}.close{position:absolute;right:14px;top:14px;border:0;border-radius:50%;width:38px;height:38px;background:#fff;color:var(--ink);font-size:20px;cursor:pointer}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{min-height:270px}}@media(max-width:720px){.topbar-inner{padding:22px clamp(18px,4vw,58px)}.panoply-wordmark{font-size:11px}.brand{margin-top:10px}.closet-wordmark{font-size:clamp(29px,8.65vw,44px);gap:.14em}.hero{display:block;min-height:auto;margin:20px 0 22px;border-radius:20px}.hero-stats{display:flex;align-items:baseline;gap:10px;border:0;padding:0;margin-top:28px}.stat{font-size:34px}.stat-label{margin:0}.toolbar{display:block;margin-top:27px}.filters{margin-bottom:13px}.search{display:block;width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{border-radius:13px}.card-info{padding:9px 10px 11px}.card-name{font-size:15px}.card-brand{font-size:9px}.card-color{font-size:10px}.count{right:8px;top:8px;padding:6px 8px}.footer{display:block;line-height:1.7}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

<script>
const data=JSON.parse(document.getElementById("wardrobe-data").textContent),items=data.items||[];let active="all",query="";const grid=document.getElementById("grid"),result=document.getElementById("results");
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(item,index){const photo=item.image?'<img src="'+esc(item.image)+'" alt="'+esc(item.brand+" "+item.name)+'" loading="lazy">':'<div class="placeholder"><div><div class="placeholder-title">'+esc(item.category)+'</div><div class="placeholder-color">'+esc(item.color)+'</div></div></div>';return '<article class="card" tabindex="0" role="button" data-index="'+index+'"><div class="photo">'+photo+'</div><div class="card-info"><div class="card-kicker"><span>'+esc(item.category)+'</span></div><div class="card-brand">'+esc(item.brand)+'</div><h2 class="card-name">'+esc(item.name)+'</h2><p class="card-color">'+esc(item.color)+'</p></div></article>'}
function render(){const filtered=items.map((item,index)=>({item,index})).filter(({item})=>(active==="all"||item.group===active)&&[item.brand,item.name,item.color,item.category].join(" ").toLowerCase().includes(query));result.innerHTML="<strong>"+filtered.length+"</strong> "+(filtered.length===1?"style":"styles");document.getElementById("pieceCount").textContent=filtered.reduce((sum,x)=>sum+x.item.quantity,0)+" pieces";grid.innerHTML=filtered.length?filtered.map(({item,index})=>card(item,index)).join(""):'<div class="empty">Nothing found. Try another search.</div>'}
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("button[data-filter]");if(!b)return;active=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});document.getElementById("search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
function openItem(index){const i=items[index];if(!i)return;const box=document.getElementById("modalPhoto");box.innerHTML=i.image?'<img src="'+esc(i.image)+'" alt="'+esc(i.brand+" "+i.name)+'">':'<div class="placeholder"><div><div class="placeholder-title">'+esc(i.category)+'</div><div class="placeholder-color">'+esc(i.color)+'</div></div></div>';document.getElementById("modalCategory").textContent=i.category;document.getElementById("modalBrand").textContent=i.brand;document.getElementById("modalName").textContent=i.name+(i.pending?" *":"");document.getElementById("modalColor").textContent=i.color;document.getElementById("modalMeta").textContent=[i.quantity>1?"×"+i.quantity:"",i.pending?"* Pending":"",i.note||""].filter(Boolean).join(" · ");document.getElementById("detail").showModal()}
grid.addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openItem(Number(c.dataset.index))});grid.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".card")){e.preventDefault();openItem(Number(e.target.dataset.index))}});document.querySelector(".close").addEventListener("click",()=>document.getElementById("detail").close());document.getElementById("detail").addEventListener("click",e=>{if(e.target.id==="detail")e.target.close()});
render();
</script>
</body></html>
